<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For Someone Special — A Meal Made With Love</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: #0e0b11;
    color: #f6eadc;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    overflow: hidden;
    user-select: none;
  }
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #1b1521 0%, #0b080d 100%);
  }
  #frame-wrap {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.85), 0 0 0 2px #2b2233;
    border-radius: 6px;
    overflow: hidden;
    background: #141018;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #pixel-canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #letter-canvas {
    pointer-events: none;
  }
  #vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 58%, rgba(10, 6, 14, 0.45) 100%);
  }
  #title-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(14, 10, 18, 0.72);
    backdrop-filter: blur(2px);
    z-index: 20;
    transition: opacity 0.8s ease;
    text-align: center;
    padding: 24px;
  }
  #title-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .badge {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #f3b57a;
    margin-bottom: 12px;
  }
  h1 {
    font-size: clamp(24px, 4vw, 44px);
    color: #fff3e4;
    text-shadow: 0 4px 0 #3a2334;
    margin-bottom: 10px;
    letter-spacing: 1px;
  }
  .subtitle {
    font-size: clamp(13px, 1.5vw, 17px);
    color: #d8c4b8;
    max-width: 540px;
    line-height: 1.5;
    margin-bottom: 28px;

  #play-start-btn {
    background: #e88d67;
    color: #1c1118;
    border: none;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    letter-spacing: 1px;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 5px 0 #9f4f36, 0 10px 25px rgba(0, 0, 0, 0.45);

    background: #f3a17c;
    transform: translateY(-2px);
  }
  #play-start-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #9f4f36;
  }
  #controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 15;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: linear-gradient(to top, rgba(12, 9, 15, 0.88), transparent);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #frame-wrap:hover #controls,

    opacity: 1;
  }
  .ctrl-btn {
    background: rgba(40, 31, 48, 0.85);
    color: #f6eadc;
    border: 1px solid rgba(243, 181, 122, 0.3);
    border-radius: 4px;
    padding: 5px 10px;
    font-size: 12px;
    font-family: inherit;

    color: #f3b57a;

    text-align: right;

  #time-label {

    position: absolute;
    bottom: 44px;

    font-size: 12px;
    color: #fcebd9;
  }
  #ending-bar.show {
    opacity: 1;
    pointer-events: auto;
  }
</style>

  // =========================================================================
  // DOM & CANVASES
  // =========================================================================
  const pCanvas = document.getElementById('pixel-canvas');

  const lCanvas = document.getElementById('letter-canvas');

  const titleOverlay = document.getElementById('title-overlay');
  const playStartBtn = document.getElementById('play-start-btn');
  const playPauseBtn = document.getElementById('play-pause-btn');

  const sceneLabel = document.getElementById('scene-label');

  // =========================================================================

  // =========================================================================
  let t = 0;

  // =========================================================================
  // MATH & PIXEL HELPERS
  // =========================================================================
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, u) => a + (b - a) * clamp(u, 0, 1);
  const smoothstep = (a, b, x) => {
    const u = clamp((x - a) / (b - a), 0, 1);
    return u * u * (3 - 2 * u);
  };
  const hash = (n) => {
    const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  };

  function pxRect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  }

  function pxCircle(cx, cy, r, color) {
    ctx.fillStyle = color;
    const x0 = Math.round(cx), y0 = Math.round(cy), rr = Math.round(r);
    for (let dy = -rr; dy <= rr; dy++) {
      for (let dx = -rr; dx <= rr; dx++) {
        if (dx * dx + dy * dy <= rr * rr) {
          ctx.fillRect(x0 + dx, y0 + dy, 1, 1);
        }
      }
    }
  }

  function pxEllipse(cx, cy, rx, ry, color) {
    ctx.fillStyle = color;
    const x0 = Math.round(cx), y0 = Math.round(cy);
    const irx = Math.round(rx), iry = Math.round(ry);
    if (irx <= 0 || iry <= 0) return;
    for (let dy = -iry; dy <= iry; dy++) {
      for (let dx = -irx; dx <= irx; dx++) {
        if ((dx * dx) / (irx * irx) + (dy * dy) / (iry * iry) <= 1) {
          ctx.fillRect(x0 + dx, y0 + dy, 1, 1);
        }
      }
    }
  }

  function pxLine(x0, y0, x1, y1, color) {
    ctx.fillStyle = color;
    let ix0 = Math.round(x0), iy0 = Math.round(y0);
    const ix1 = Math.round(x1), iy1 = Math.round(y1);
    const dx = Math.abs(ix1 - ix0), sx = ix0 < ix1 ? 1 : -1;
    const dy = -Math.abs(iy1 - iy0), sy = iy0 < iy1 ? 1 : -1;
    let err = dx + dy;
    while (true) {
      ctx.fillRect(ix0, iy0, 1, 1);
      if (ix0 === ix1 && iy0 === iy1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; ix0 += sx; }
      if (e2 <= dx) { err += dx; iy0 += sy; }
    }
  }

  function pxText(str, x, y, color, align = 'left', size = 14) {
    ctx.font = `bold ${size}px monospace`;
    ctx.textAlign = align;
    ctx.fillStyle = 'rgba(14, 10, 18, 0.78)';
    ctx.fillText(str, Math.round(x) + 1, Math.round(y) + 1);
    ctx.fillStyle = color;
    ctx.fillText(str, Math.round(x), Math.round(y));

  // =========================================================================
  // PIXEL-ART SPRITE COMPILER & HAND-CRAFTED FOOD/PROP SPRITE SHEET
  // =========================================================================
  function makeSprite(rows, palette) {
    const h = rows.length;
    const w = rows[0].length;
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const g = c.getContext('2d');
    for (let y = 0; y < h; y++) {
      const row = rows[y];
      for (let x = 0; x < w; x++) {
        const ch = row[x];
        if (ch !== '.' && palette[ch]) {
          g.fillStyle = palette[ch];
          g.fillRect(x, y, 1, 1);
        }
      }
    }
    return c;
  }

  function drawSprite(spr, x, y, scale = 1, flipX = false, alpha = 1) {
    ctx.save();
    if (alpha < 1) ctx.globalAlpha = alpha;
    ctx.imageSmoothingEnabled = false;
    const dw = Math.round(spr.width * scale);
    const dh = Math.round(spr.height * scale);
    const dx = Math.round(x - dw / 2);
    const dy = Math.round(y - dh / 2);
    if (flipX) {
      ctx.translate(dx + dw, dy);
      ctx.scale(-1, 1);
      ctx.drawImage(spr, 0, 0, dw, dh);
    } else {
      ctx.drawImage(spr, dx, dy, dw, dh);
    }
    ctx.restore();
  }

  // Pleated Steamed Dumpling (22x14)
  const SPR_DUMPLING = makeSprite([

    '.oSSDDDDDDDDDDDDDDSSo.',

  ], {
    o: '#24171c', H: '#ffffff', L: '#fbf2e2', m: '#e8d5b8',
    M: '#cbb392', l: '#f4e6cf', S: '#d4bc9b', D: '#a88c6c'
  });

  // Salmon Nigiri (26x16) — inspired by reference sprite sheet
  const SPR_NIGIRI = makeSprite([
    '.......oooooooooo.........',
    '.....ooOOFOOOFOOOoo.......',
    '...ooOOFSOOOFSOOFOOoo.....',
    '..oOOFSOOOFSOOOFSOOFOo....',
    '.oOFSOOOFSOOOFSOOOFSOOo...',
    'oOFSOOOFSDDDDFSOOOFSDDFo..',
    'oOSDDDFSDDDDDDDDDDDDDDFOo.',
    '.ooDDDDooRRRRRRRRRooooooo.',
    '...oooo.oRRRrrrRRRro......',
    '........oRRrrrrrRRRo......',
    '........oRrrBBrrrRRo......',
    '.........ooBBBBBBoo.......',
    '...........oooooo.........',
  ], {
    o: '#1a1116', O: '#eb6838', F: '#ffbfa8', S: '#f78d56',
    D: '#b84225', R: '#faf4ea', r: '#e3d8c8', B: '#bfb19f'
  });

  // Maki Sushi Roll (18x16)
  const SPR_MAKI = makeSprite([
    '....oooooooooo....',
    '..ooNNNNNNNNNNoo..',
    '.oNNRRRRRRRRRRNNo.',
    'oNNRRrRRrrRRrRRNNo',
    'oNRRrRoooooORrRNNo',
    'oNRrRoOOFFoGOrRNNo',
    'oNRrRoOOFooGOrRNNo',
    'oNRrRoSSSSGGorRNNo',
    'oNNRrRooooooRrRNNo',
    'oNNRRRRrrrrRRRRNNo',
    'oNnnRRRRRRRRRRnnNo',
    '.oNnnnnNNNNnnnnNo.',
    '..ooNNNNNNNNNNoo..',
    '....oooooooooo....',
  ], {
    o: '#151218', N: '#263d34', n: '#192923', R: '#f8f3eb',
    r: '#dcd1c2', O: '#eb6838', F: '#ffbca4', S: '#c44627', G: '#63a84f'
  });

  // Crispy Fried Chicken Drumstick (28x18) — 5-tone dithered crust
  const SPR_DRUMSTICK = makeSprite([
    '.................oooooo.....',
    '................oBBBBBBoo...',
    '...............oBWWWWWWWBo..',
    '..........ooooooBBWWWWWWBo..',
    '.......oooGGYGGYBBBWWWWBo...',
    '.....ooGYGYYGGGGYBBBBBoo....',
    '...ooGYYGGMDMGGYYGGBBo......',
    '..oGYGMDMDDMDDMGGYGBo.......',
    '.oGYMDDSSSSDDDDMDGYo........',
    '.oYMDDSSKKSSSDDDMGYo........',
    'oGYMDSKKKKSSSDDDMGo.........',
    'oGYMDDSSKKSSDDMMGo..........',
    '.oYMDDDDDDDDMMGoo...........',

  ], {

    Y: '#ffd76a', M: '#b54c14', D: '#8c2d0d', S: '#6b1e08', K: '#4f1505'

  // Crispy Fried Chicken Thigh (24x16)
  const SPR_THIGH = makeSprite([
    '.......oooooooooo.......',

    '.oGYGMDMGGYYGGMDMGGGGo..',

  // Steamed Rice Cake (14x10)
  const SPR_RICE_CAKE = makeSprite([

  // Chef Knife (30x10)
  const SPR_KNIFE = makeSprite([

    '.oHHMMMMMMMMMMMMMMBBBBBBBBBBBoo',

  // =========================================================================
  // PROCEDURAL WEB AUDIO ENGINE
  // =========================================================================
  let audioCtx = null;
  let masterGain = null;

  function initAudio() {
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = muted ? 0 : 0.35;
    masterGain.connect(audioCtx.destination);
  }

  function setMute(m) {
    muted = m;
    muteBtn.textContent = muted ? 'Sound: Off' : 'Sound: On';
    if (masterGain && audioCtx) {
      masterGain.gain.setTargetAtTime(muted ? 0 : 0.35, audioCtx.currentTime, 0.05);
    }
  }

  function playNote(freq, dur, type = 'triangle', vol = 0.09, attack = 0.03) {
    if (!audioCtx || muted || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1800;

    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vol, now + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    osc.connect(filter);
    filter.connect(g);
    g.connect(masterGain);
    osc.start(now);
    osc.stop(now + dur + 0.05);
  }

  function playNoiseBurst(dur, freq, q, vol = 0.06) {
    if (!audioCtx || muted || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    const len = Math.floor(audioCtx.sampleRate * dur);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;

    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = freq;
    filter.Q.value = q;

    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    src.connect(filter);
    filter.connect(g);
    g.connect(masterGain);
    src.start(now);
  }

  function playDoorbell() {
    if (!audioCtx || muted || audioCtx.state !== 'running') return;
    playNote(659.25, 0.7, 'sine', 0.22, 0.01); // E5
    setTimeout(() => playNote(523.25, 1.1, 'sine', 0.22, 0.01), 240); // C5
  }

  const CHORDS = [
    [174.61, 220.00, 261.63, 329.63], // Fmaj7
    [164.81, 196.00, 246.94, 293.66], // Em7
    [146.83, 174.61, 220.00, 261.63], // Dm7
    [130.81, 164.81, 196.00, 246.94], // Cmaj7
  ];
  const MELODY = [523.25, 587.33, 659.25, 523.25, 440.00, 493.88, 523.25, 392.00];

  function updateAudioForTime(nowT) {
    if (!audioCtx || !playing || audioCtx.state !== 'running') return;

    // Gentle beat every 0.5s
    const step = Math.floor(nowT * 2);
    if (step !== lastBeepStep) {
      lastBeepStep = step;
      const inInterruption = nowT >= 106.0 && nowT < 109.0;
      if (!inInterruption) {
        if (step % 4 === 0) {
          const chord = CHORDS[Math.floor(step / 4) % CHORDS.length];
          const vol = nowT >= 78 ? 0.055 : 0.07;
          chord.forEach((f, idx) => {
            setTimeout(() => playNote(f, 1.8, 'sine', vol, 0.05), idx * 45);
          });
        }
        if (step % 2 === 1 && nowT < 122) {
          const m = MELODY[step % MELODY.length];
          playNote(m, 0.55, 'triangle', nowT >= 78 ? 0.04 : 0.055, 0.02);
        }
      }

      // Contextual Foley SFX
      if (nowT >= 9.5 && nowT <= 13.0) {
        playNoiseBurst(0.06, 1400, 2.5, 0.05); // chopping herbs
      }
      if (nowT >= 20.0 && nowT <= 23.5) {

  // =========================================================================
  // CINEMATIC CAMERA SYSTEM & ATMOSPHERIC HELPERS
  // =========================================================================
  const easeInOut = (u) => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);

  function withCamera(cx, cy, zoom, rot, drawFn) {
    ctx.save();
    ctx.translate(W / 2, H / 2);
    if (rot) ctx.rotate(rot);
    ctx.scale(zoom, zoom);
    ctx.translate(-cx, -cy);
    drawFn();
    ctx.restore();
  }

  function drawAO(cx, cy, rx, ry, alpha = 0.28) {
    ctx.fillStyle = `rgba(18, 10, 16, ${alpha})`;
    ctx.beginPath();
    ctx.ellipse(Math.round(cx), Math.round(cy), Math.round(rx), Math.round(ry), 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawStoveBurner(cx, cy, time, intensity = 1) {
    // Cast-iron grate & burner ring
    pxRect(cx - 56, cy + 4, 112, 8, '#232028');
    pxRect(cx - 48, cy, 96, 6, '#34303b');
    pxRect(cx - 52, cy - 2, 16, 4, '#474250');
    pxRect(cx + 36, cy - 2, 16, 4, '#474250');
    // Flickering gas flames (blue base + orange-gold tips)
    for (let i = -3; i <= 3; i++) {
      const fx = cx + i * 11;
      const flick = Math.sin(time * 22 + i * 2.3) * 3 * intensity;
      const fh = (8 + flick) * intensity;
      ctx.fillStyle = 'rgba(70, 175, 255, 0.9)';
      ctx.fillRect(Math.round(fx - 3), Math.round(cy - fh * 0.5), 6, Math.round(fh * 0.55));
      ctx.fillStyle = 'rgba(255, 165, 55, 0.92)';
      ctx.fillRect(Math.round(fx - 2), Math.round(cy - fh), 4, Math.round(fh * 0.65));
      ctx.fillStyle = 'rgba(255, 235, 140, 0.95)';
      ctx.fillRect(Math.round(fx - 1), Math.round(cy - fh * 0.8), 2, Math.round(fh * 0.4));
    }
    // Warm under-glow
    const glow = ctx.createRadialGradient(cx, cy - 4, 4, cx, cy - 4, 65 * intensity);
    glow.addColorStop(0, 'rgba(255, 140, 50, 0.28)');
    glow.addColorStop(1, 'rgba(255, 140, 50, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(cx - 70, cy - 55, 140, 70);
  }

  function drawSteam(x, y, count, time, spread = 24, height = 64) {
    for (let i = 0; i < count; i++) {
      const phase = (time * 0.55 + i * (1 / count)) % 1;
      const sway = Math.sin(time * 2.4 + i * 1.7) * (spread * 0.35);
      const sx = x + sway + (i - count / 2) * (spread / count) * 1.4;
      const sy = y - phase * height;
      const alpha = Math.sin(phase * Math.PI) * 0.42;
      const r = 3 + phase * 6;
      ctx.fillStyle = `rgba(255, 248, 238, ${alpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(Math.round(sx), Math.round(sy), Math.round(r), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawFloatingMotes(time, count = 18, color = 'rgba(255, 236, 195, 0.35)') {
    ctx.fillStyle = color;
    for (let i = 0; i < count; i++) {
      const mx = (hash(i * 13.7) * W + time * (4 + (i % 3) * 2)) % W;
      const my = (hash(i * 29.3) * (H - 60) + Math.sin(time * 0.9 + i) * 10);
      const sz = i % 4 === 0 ? 2 : 1;
      ctx.fillRect(Math.round(mx), Math.round(my), sz, sz);
    }
  }

  function drawForegroundHand(x, y, side = 1, pinch = 0, gripOffset = 0) {

    ctx.beginPath();
    ctx.ellipse(Math.round(x + side * 48), Math.round(y + 28), 30, 15, side * 0.35, 0, Math.PI * 2);

    ctx.ellipse(Math.round(x + side * 48), Math.round(y + 28), 28, 13, side * 0.35, 0, Math.PI * 2);

    pxEllipse(x + side * 18, y + 10, 17, 12, '#1b1218');

    pxEllipse(x + side * 14, y + 8, 11, 7, '#f6cfb4');

    pxEllipse(x - side * 2 + p * side, y - 2 + gripOffset, 8, 5, '#1b1218');
    pxEllipse(x - side * 2 + p * side, y - 2 + gripOffset, 6, 3, '#f6cfb4');

    pxEllipse(x - side * 5 + p * side, y + 4 + gripOffset, 6, 3, '#efb999');

    pxEllipse(x + side * 4, y - 6 + p * 0.5, 7, 5, '#1b1218');
    pxEllipse(x + side * 4, y - 6 + p * 0.5, 5, 3, '#f8d8c0');
  }

  // =========================================================================
  // SCENE 1: PREPARING THE DUMPLINGS (0s - 24s)
  // =========================================================================
  function renderScene1(lt) {
    // Dynamic camera direction:
    // 0-3s: Wide establishing shot -> gentle push-in
    // 3-6s: Overhead-angled counter zoom on mixing bowl
    // 6-9.5s: Side-angle kneading & dividing dough
    // 9.5-13.5s: Macro tracking shot of knife chopping herbs & chicken bowl
    // 13.5-17s: First-person POV macro of hands folding individual pleats!
    // 17-24s: Low-angle shot of bamboo steamer over stove flames + lid lift
    let camX = 320, camY = 180, camZ = 1.0, camR = 0;
    if (lt < 3.0) {
      const u = easeInOut(lt / 3.0);
      camZ = lerp(0.92, 1.08, u);
      camY = lerp(175, 192, u);
    } else if (lt < 6.0) {
      const u = easeInOut((lt - 3.0) / 3.0);
      camZ = lerp(1.08, 1.32, u);
      camY = lerp(192, 224, u);
    } else if (lt < 9.5) {
      camZ = 1.36;
      camX = 320 + Math.sin(lt * 3) * 6;
      camY = 232;
    } else if (lt < 13.5) {
      const u = easeInOut((lt - 9.5) / 4.0);
      camZ = lerp(1.42, 1.50, u);
      camX = lerp(290, 355, u);
      camY = 240;
    } else if (lt < 17.0) {
      camZ = 1.52;
      camX = 320;
      camY = 246;
    } else {
      const u = easeInOut(clamp((lt - 17.0) / 4.0, 0, 1));
      camZ = lerp(1.22, 1.44, u);
      camY = lerp(218, 224, u);
    }

    withCamera(camX, camY, camZ, camR, () => {
      drawKitchenBackground(0, 0.04, lt);

      const bob = Math.sin(lt * 4) * 2.5;
      const armSpeed = lt > 6 && lt < 17 ? lt * 8 : lt * 3;
      if (lt < 13.5 || lt >= 17.0) {
        drawChef(320, 146 + Math.abs(bob) * 0.5, armSpeed, -armSpeed + 1.2, Math.sin(lt * 1.5) * 2, 0, lt > 9 ? 'focused' : 'happy');
      }

      // Richly grained maple cutting board with contact shadow
      drawAO(320, 316, 152, 14, 0.28);
      pxRect(172, 250, 296, 68, '#deb887');
      pxRect(172, 312, 296, 7, '#b58856');
      for (let i = 0; i < 6; i++) {
        pxRect(184 + i * 48, 260 + (i % 2) * 18, 32, 2, '#cfa36e');
      }

      // Flour jar & glass water pitcher on left
      drawAO(78, 296, 28, 7, 0.25);
      pxRect(52, 238, 44, 54, '#f2ece1');
      pxRect(52, 238, 8, 54, '#ded5c5');
      pxRect(56, 230, 36, 8, '#a67247');
      pxText('FLOUR', 74, 270, '#8d7d6c', 'center', 10);

      drawAO(126, 296, 20, 6, 0.22);
      pxRect(108, 246, 32, 46, '#90c2e3');
      pxRect(112, 252, 24, 34, '#bde4fa');
      pxRect(114, 254, 4, 26, '#e6f7ff'); // glass highlight

      // 0-6s: Pouring flour & water into ceramic mixing bowl
      if (lt < 6.0) {
        drawAO(320, 296, 52, 12, 0.3);
        pxEllipse(320, 286, 48, 20, '#c85a46');
        pxEllipse(320, 278, 44, 14, '#e0725c');
        pxEllipse(320, 278, 40, 11, '#f4ede2');

        if (lt >= 1.4 && lt < 4.4) {
          const pour = Math.sin((lt - 1.4) * 6) * 3;
          pxRect(314 + pour, 212, 10, 62, '#fffaf0');
          for (let i = 0; i < 24; i++) {
            const pPhase = (lt * 2.5 + i * 0.13) % 1;
            const px = 290 + hash(i + Math.floor(lt * 12)) * 60;
            const py = 225 + pPhase * 55;
            pxRect(px, py, 3, 3, '#fffdf7');
          }
        }
        if (lt >= 3.8 && lt < 6.0) {
          // Animated water stream + splash droplets
          ctx.strokeStyle = '#a6dcf7';
          ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(280, 224); ctx.quadraticCurveTo(302, 245, 314, 276); ctx.stroke();
          for (let i = 0; i < 6; i++) {

      else if (lt < 9.5) {

        const wRx = lerp(28, 22, foldU);
        const wRy = lerp(16, 14, foldU);
        pxEllipse(320, 286, wRx, wRy, '#f9eed9');
        pxEllipse(320, 286, wRx - 4, wRy - 4, '#fff7e8');
        // Chicken filling visible before pleats close over it
        if (foldU < 0.75) {

          pxRect(316, 282, 3, 3, '#55a64e');
          pxRect(322, 286, 3, 3, '#55a64e');
        }
        // Individual pleats forming sequentially!
        const pleatCount = Math.floor(foldU * 8);
        for (let p = 0; p < pleatCount; p++) {

          pxRect(px, 274 + Math.abs(p - 3.5) * 0.8, 2, 7, '#cfb795');

        drawForegroundHand(356, 284, 1, pinch);

      // 17-24s: Arranging in bamboo steamer over stove flames & volumetric steam
      else {
        drawStoveBurner(320, 308, lt, 0.9);
        const sx = 320, sy = 278;
        // Metal steaming pot base + bamboo basket
        pxRect(sx - 66, sy + 10, 132, 22, '#626975');
        pxEllipse(sx, sy + 12, 62, 20, '#b57f4b');
        pxRect(sx - 62, sy - 14, 124, 26, '#cfa06b');
        pxEllipse(sx, sy - 14, 62, 19, '#7a5230');
        // Bamboo weave lines
        for (let x = sx - 56; x < sx + 56; x += 12) {
          pxRect(x, sy - 6, 6, 12, '#b88652');
        }
        // Glossy pleated dumplings inside
        const spots = [[-28, -14], [0, -20], [28, -14], [-16, -4], [16, -4]];
        spots.forEach(([ox, oy]) => {
          drawSprite(SPR_DUMPLING, sx + ox, sy + oy, 1.5);

        let lidOffset = 0;
        if (lt < 18.6) lidOffset = -64 * (1 - smoothstep(17.0, 18.6, lt));
        else if (lt > 21.4) lidOffset = -72 * smoothstep(21.4, 23.2, lt);

        if (lt >= 17.4 && lt <= 23.0) {
          pxEllipse(sx, sy - 20 + lidOffset, 64, 20, '#d9aa73');
          pxEllipse(sx, sy - 26 + lidOffset, 58, 16, '#c4925a');
          pxRect(sx - 10, sy - 34 + lidOffset, 20, 6, '#8f5f34');

    let cap = '1. Mixing flour & water';
    if (lt >= 6 && lt < 8) cap = 'Kneading elastic dough...';
    else if (lt >= 8 && lt < 9.5) cap = 'Dividing dough portions';
    else if (lt >= 9.5 && lt < 13.5) cap = 'Chopping scallions & mixing chicken filling';
    else if (lt >= 13.5 && lt < 17.0) cap = 'Folding each dumpling with neat pleats';
    else if (lt >= 17.0 && lt < 21.6) cap = 'Steaming in bamboo basket...';
    else if (lt >= 21.6) cap = 'Glossy steamed dumplings!';
    pxText(cap, W / 2, H - 14, '#f7e4cf', 'center', 13);
  }

  // =========================================================================
  // SCENE 5 & 6 & 7: ROOM, WINDOW, WIND & HANDWRITTEN LETTER (640x360)
  // =========================================================================
  function drawStudyRoom(lt, globalT) {
    // Cozy evening study room
    pxRect(0, 0, W, H, '#1b1522');
    // Subtle wallpaper wainscoting
    pxRect(0, 210, W, 24, '#261d2e');
    // Bookshelf in left background
    pxRect(24, 52, 92, 160, '#2c1e26');
    pxRect(30, 62, 80, 36, '#1f141c');
    pxRect(30, 108, 80, 36, '#1f141c');
    for (let i = 0; i < 6; i++) {
      pxRect(34 + i * 12, 70 + (i % 2) * 4, 9, 26 - (i % 2) * 4, i % 2 === 0 ? '#7c4d52' : '#4f6d7a');
    }

    // Open window on the right
    const wx = 432, wy = 28, ww = 172, wh = 184;
    pxRect(wx - 8, wy - 8, ww + 16, wh + 16, '#3b2832');
    pxRect(wx, wy, ww, wh, '#222b45');
    pxRect(wx, wy + 104, ww, 80, '#363b5e');
    // Stars & crescent moon
    pxRect(wx + 32, wy + 28, 2, 2, '#fff3cf');
    pxRect(wx + 116, wy + 44, 2, 2, '#fff3cf');
    pxRect(wx + 76, wy + 18, 3, 3, '#ffe9a8');
    pxCircle(wx + 136, wy + 34, 10, '#ffe9a8');
    pxCircle(wx + 140, wy + 32, 9, '#222b45');

    // Curtain swaying (stronger wind during Scene 6!)
    const windAmt = globalT >= 108.5 && globalT < 115 ? Math.sin(globalT * 10) * 20 + 20 : Math.sin(globalT * 2) * 4;
    ctx.fillStyle = '#d9b5a0';
    ctx.beginPath();
    ctx.moveTo(wx, wy);
    ctx.lineTo(wx + 36, wy);
    ctx.lineTo(wx + 28 - windAmt, wy + wh);
    ctx.lineTo(wx, wy + wh);
    ctx.closePath();
    ctx.fill();

    // Warm desk lamp on left
    pxRect(44, 184, 32, 8, '#8c6239');
    pxRect(56, 112, 8, 72, '#8c6239');
    pxRect(36, 84, 52, 32, '#f4b860');
    const lampCone = ctx.createRadialGradient(62, 116, 10, 120, 230, 260);
    lampCone.addColorStop(0, 'rgba(255, 205, 125, 0.24)');
    lampCone.addColorStop(1, 'rgba(255, 185, 105, 0)');
    ctx.fillStyle = lampCone;
    ctx.fillRect(0, 80, 380, 280);

    // Wooden desk
    pxRect(0, 228, W, 132, '#5c3c2e');
    pxRect(0, 228, W, 8, '#734b39');

    // Doorbell chime visual at 106.0 - 108.5s
    if (globalT >= 106.0 && globalT < 108.5) {
      const p = (globalT - 106.0) * 2;
      pxText('DING-DONG!', 110, 52, '#ffe58f', 'center', 15);
      ctx.strokeStyle = `rgba(255, 230, 140, ${clamp(1 - p * 0.4, 0, 1)})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(110, 48, 20 + (p * 36) % 48, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Gust of wind streaks in Scene 6
    if (globalT >= 108.5 && globalT < 115.5) {
      for (let i = 0; i < 12; i++) {
        const wyLine = 54 + i * 24;
        const wxLine = (580 - ((globalT - 108.5) * 280 + i * 64) % 680);
        pxLine(wxLine, wyLine, wxLine - 56, wyLine + 8, 'rgba(210, 230, 255, 0.45)');
      }
    }
  }

  // =========================================================================
  // CRISP READABLE HANDWRITTEN LETTER OVERLAY (SCENES 5, 6, 7)
  // =========================================================================
  function renderLetterOverlay(globalT) {
    lCtx.clearRect(0, 0, lCanvas.width, lCanvas.height);
    if (globalT < 78.0) return;

    const cw = lCanvas.width;
    const ch = lCanvas.height;

    // Determine how many characters are written so far
    // Scene 5: 80.0s -> 106.0s writes all characters cleanly
    let charsToShow = FULL_LETTER_CHARS;
    if (globalT < 80.0) {
      charsToShow = 0;
    } else if (globalT < 106.0) {
      const u = (globalT - 80.0) / 26.0;
      charsToShow = Math.floor(u * FULL_LETTER_CHARS);
    }

    // Compute paper transform:
    // Scene 5 (78-106s): flat/angled on desk, comfortable close-up
    // Scene 6 (106-115s): lifts off desk, flutters & drifts out window, then toward camera
    // Scene 7 (115-128s): approaches lens and lands gently filling almost entire frame!
    let px = cw * 0.50;
    let py = ch * 0.54;
    let scale = 0.86;
    let rot = -0.02;
    let alpha = 1;

    if (globalT < 80.0) {
      alpha = smoothstep(78.0, 79.5, globalT);
      py = lerp(ch * 0.68, ch * 0.54, alpha);
    } else if (globalT >= 108.5 && globalT < 115.0) {
      const u = (globalT - 108.5) / 6.5;
      // Flutter away toward window then curve back toward camera
      const arc = Math.sin(u * Math.PI);
      px = lerp(cw * 0.50, cw * 0.72, arc) + Math.sin(u * 11) * 28;
      py = lerp(ch * 0.54, ch * 0.34, arc) + Math.cos(u * 9) * 18;
      scale = lerp(0.86, 0.24, Math.sin(u * Math.PI * 0.85));
      rot = Math.sin(u * 8) * 0.38;
    } else if (globalT >= 115.0 && globalT < 119.2) {
      const u = smoothstep(115.0, 119.2, globalT);
      px = lerp(cw * 0.62, cw * 0.50, u) + Math.sin(u * 6) * (1 - u) * 30;
      py = lerp(ch * 0.42, ch * 0.50, u) + Math.cos(u * 5) * (1 - u) * 20;
      scale = lerp(0.28, 1.04, u);
      rot = lerp(0.22, 0.0, u);
    } else if (globalT >= 119.2) {
      // Resting gently against the camera
      px = cw * 0.50;
      py = ch * 0.50;
      scale = 1.04;
      rot = 0;
    }

    lCtx.save();
    lCtx.globalAlpha = alpha;
    lCtx.translate(px, py);
    lCtx.rotate(rot);
    lCtx.scale(scale, scale);

    const paperW = 760;
    const paperH = 610;
    const left = -paperW / 2;
    const top = -paperH / 2;

    // Paper drop shadow
    lCtx.fillStyle = 'rgba(10, 6, 14, 0.45)';
    lCtx.fillRect(left + 12, top + 14, paperW, paperH);

    // Warm cream letter paper
    lCtx.fillStyle = '#fbf3e4';
    lCtx.fillRect(left, top, paperW, paperH);
    lCtx.strokeStyle = '#dfd0b8';
    lCtx.lineWidth = 3;
    lCtx.strokeRect(left, top, paperW, paperH);

    // Faint ruled lines for authentic notebook/letter feel
    lCtx.strokeStyle = 'rgba(180, 198, 218, 0.38)';
    lCtx.lineWidth = 1;
    for (let ly = top + 46; ly < top + paperH - 22; ly += 23) {
      lCtx.beginPath();
      lCtx.moveTo(left + 28, ly);
      lCtx.lineTo(left + paperW - 28, ly);
      lCtx.stroke();
    }

    // Crisp, readable handwritten-style ink text
    lCtx.fillStyle = '#242942';
    lCtx.font = 'italic 18px "Segoe Script", "Brush Script MT", "Comic Sans MS", Georgia, serif';
    lCtx.textBaseline = 'bottom';

    let remaining = charsToShow;
    let penX = left + 42;
    let penY = top + 45;
    let penActive = false;

    for (let i = 0; i < LETTER_LINES.length; i++) {
      const line = LETTER_LINES[i];
      const y = top + 45 + i * 23;
      if (remaining <= 0) break;

      const slice = line.slice(0, remaining);
      lCtx.fillText(slice, left + 42, y);

      if (remaining <= line.length && globalT >= 80.0 && globalT < 106.0) {
        penX = left + 42 + lCtx.measureText(slice).width;
        penY = y - 2;
        penActive = true;
      }
      remaining -= (line.length + 1);
    }

    // Draw animated pen & hand while writing (Scene 5)
    if (penActive) {
      // Pen nib & barrel
      lCtx.save();
      lCtx.translate(penX, penY);
      lCtx.rotate(-0.45);
      // Nib
      lCtx.fillStyle = '#d4af37';
      lCtx.beginPath();
      lCtx.moveTo(0, 0);
      lCtx.lineTo(6, -14);
      lCtx.lineTo(-4, -14);
      lCtx.closePath();
      lCtx.fill();
      // Pen body
      lCtx.fillStyle = '#2c2233';
      lCtx.fillRect(-5, -96, 12, 82);
      // Hand fingers gripping pen
      lCtx.fillStyle = '#f0bfa0';
      lCtx.beginPath();
      lCtx.ellipse(14, -36, 26, 18, 0.2, 0, Math.PI * 2);
      lCtx.fill();
      lCtx.restore();
    } else if (globalT >= 106.0 && globalT < 107.6) {
      // Doorbell interruption: pen lifts slightly off the last word!
      const lift = smoothstep(106.0, 107.0, globalT) * 35;
      lCtx.save();
      lCtx.translate(left + 106 + lift, top + 45 + 22 * 23 - lift);
      lCtx.rotate(-0.65);
      lCtx.fillStyle = '#2c2233';
      lCtx.fillRect(-5, -90, 12, 82);
      lCtx.restore();
    }

    lCtx.restore();
  }

  // =========================================================================
  // MAIN RENDER LOOP
  // =========================================================================
  function getScene(nowT) {
    for (const s of SCENES) {
      if (nowT >= s.start && nowT < s.end) return s;
    }
    return SCENES[SCENES.length - 1];
  }

  function formatTime(sec) {
    const s = Math.floor(sec);
    const m = Math.floor(s / 60);
    const r = s % 60;
    return `${m}:${r < 10 ? '0' : ''}${r}`;
  }

  function renderFrame(nowT) {
    const s = getScene(nowT);
    const lt = nowT - s.start;

    if (s.id === 1) renderScene1(lt);
    else if (s.id === 2) renderScene2(lt);
    else if (s.id === 3) renderScene3(lt);
    else if (s.id === 4) renderScene4(lt);
    else drawStudyRoom(lt, nowT);

    // Smooth cross-fade transitions between scenes 1..5
    for (const sc of SCENES) {
      if (sc.id > 1 && sc.id <= 5 && Math.abs(nowT - sc.start) < 0.45) {
        const fade = 1 - Math.abs(nowT - sc.start) / 0.45;
        ctx.fillStyle = `rgba(14, 10, 18, ${fade * 0.7})`;
        ctx.fillRect(0, 0, W, H);
      }
    }

    renderLetterOverlay(nowT);

    // Update UI
    sceneLabel.textContent = s.name;
    scrubber.value = nowT;
    timeLabel.textContent = `${formatTime(nowT)} / ${formatTime(TOTAL_DURATION)}`;

    if (nowT >= 122.0) {
      endingBar.classList.add('show');
    } else {
      endingBar.classList.remove('show');
    }
  }

  function loop(nowMs) {
    const dt = Math.min(0.1, (nowMs - lastFrameMs) / 1000);
    lastFrameMs = nowMs;

    if (playing) {
      t += dt;
      if (t >= TOTAL_DURATION) {
        t = TOTAL_DURATION;
        playing = false;
        playPauseBtn.textContent = 'Replay';
      }
      updateAudioForTime(t);
    }

    renderFrame(t);
    requestAnimationFrame(loop);
  }

  // =========================================================================
  // CONTROLS & EVENTS
  // =========================================================================
  function startFilm() {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    started = true;
    playing = true;
    titleOverlay.classList.add('hidden');
    playPauseBtn.textContent = 'Pause';
    controls.classList.add('visible');
    setTimeout(() => controls.classList.remove('visible'), 2500);
  }

  function resetFlagsForSeek(newT) {
    if (newT < 72.2) latchPlayed = false;
    if (newT < 106.0) doorbellPlayed = false;
    if (newT < 108.8) windPlayed = false;
  }

  playStartBtn.addEventListener('click', startFilm);

  playPauseBtn.addEventListener('click', () => {
    if (!started) { startFilm(); return; }
    if (t >= TOTAL_DURATION) {
      t = 0;
      resetFlagsForSeek(0);
      playing = true;
      playPauseBtn.textContent = 'Pause';
      return;
    }
    playing = !playing;
    playPauseBtn.textContent = playing ? 'Pause' : 'Play';
  });

  replayEndBtn.addEventListener('click', () => {
    t = 0;
    resetFlagsForSeek(0);
    playing = true;
    playPauseBtn.textContent = 'Pause';
  });

  muteBtn.addEventListener('click', () => setMute(!muted));

  scrubber.addEventListener('input', (e) => {
    t = parseFloat(e.target.value);
    resetFlagsForSeek(t);
    renderFrame(t);
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      playPauseBtn.click();
    }
  });

  // Render initial preview frame behind title overlay
  renderFrame(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
