<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For Someone Special — A Meal Made With Love</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: #0e0b11;
    color: #f6eadc;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    overflow: hidden;
    user-select: none;
  }
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #1b1521 0%, #0b080d 100%);
  }
  #frame-wrap {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.85), 0 0 0 2px #2b2233;
    border-radius: 6px;
    overflow: hidden;
    background: #141018;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #pixel-canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #letter-canvas {
    pointer-events: none;
  }
  #vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 58%, rgba(10, 6, 14, 0.45) 100%);
  }
  #title-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(14, 10, 18, 0.72);
    backdrop-filter: blur(2px);
    z-index: 20;
    transition: opacity 0.8s ease;
    text-align: center;
    padding: 24px;
  }
  #title-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .badge {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #f3b57a;
    margin-bottom: 12px;
  }
  h1 {
    font-size: clamp(24px, 4vw, 44px);
    color: #fff3e4;
    text-shadow: 0 4px 0 #3a2334;
    margin-bottom: 10px;
    letter-spacing: 1px;
  }
  .subtitle {
    font-size: clamp(13px, 1.5vw, 17px);
    color: #d8c4b8;
    max-width: 540px;
    line-height: 1.5;
    margin-bottom: 28px;
  }
  #play-start-btn {
    background: #e88d67;
    color: #1c1118;
    border: none;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    letter-spacing: 1px;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 5px 0 #9f4f36, 0 10px 25px rgba(0, 0, 0, 0.45);
    transition: transform 0.12s ease, background 0.15s ease;
  }
  #play-start-btn:hover {
    background: #f3a17c;
    transform: translateY(-2px);
  }
  #play-start-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #9f4f36;
  }
  #controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 15;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: linear-gradient(to top, rgba(12, 9, 15, 0.88), transparent);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #frame-wrap:hover #controls,
  #controls.visible {
    opacity: 1;
  }
  .ctrl-btn {
    background: rgba(40, 31, 48, 0.85);
    color: #f6eadc;
    border: 1px solid rgba(243, 181, 122, 0.3);
    border-radius: 4px;
    padding: 5px 10px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
  }
  .ctrl-btn:hover {
    background: rgba(66, 50, 78, 0.95);
    border-color: #f3b57a;
  }
  #scrubber {
    flex: 1;
    accent-color: #e88d67;
    cursor: pointer;
    height: 4px;
  }
  #scene-label {
    font-size: 11px;
    color: #f3b57a;
    min-width: 145px;
    text-align: right;
    white-space: nowrap;
  }
  #time-label {
    font-size: 11px;
    color: #cbbab0;
    min-width: 72px;
    text-align: right;
  }
  #ending-bar {
    position: absolute;
    bottom: 44px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 16;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 16px;
    border-radius: 999px;
    background: rgba(22, 16, 26, 0.88);
    border: 1px solid rgba(243, 181, 122, 0.45);
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease;
    font-size: 12px;
    color: #fcebd9;
  }
  #ending-bar.show {
    opacity: 1;
    pointer-events: auto;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="frame-wrap">
    <canvas id="pixel-canvas" width="320" height="180"></canvas>
    <canvas id="letter-canvas" width="1280" height="720"></canvas>
    <div id="vignette"></div>

    <div id="title-overlay">
      <div class="badge">Happy Birthday, Gungun</div>
      <h1>A Meal Made With Love</h1>
      <p class="subtitle">
        A homemade feast, an unfinished love letter, and a feeling that couldn't quite fit into words.
      </p>
      <button id="play-start-btn">&#9654; Play Film</button>
    </div>

    <div id="ending-bar">
      <span>For Bubu &mdash; made with every little effort.</span>
      <button class="ctrl-btn" id="replay-end-btn">Replay</button>
    </div>

    <div id="controls">
      <button class="ctrl-btn" id="play-pause-btn">Pause</button>
      <button class="ctrl-btn" id="mute-btn">Sound: On</button>
      <input id="scrubber" type="range" min="0" max="128" step="0.1" value="0" />
      <span id="scene-label">1. Preparing Dumplings</span>
      <span id="time-label">0:00 / 2:08</span>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // =========================================================================
  // CONSTANTS & TIMELINE
  // =========================================================================
  const W = 320;
  const H = 180;
  const TOTAL_DURATION = 128.0;

  const SCENES = [
    { id: 1, start: 0,   end: 24,  name: '1. Preparing Dumplings' },
    { id: 2, start: 24,  end: 46,  name: '2. Preparing Sushi' },
    { id: 3, start: 46,  end: 66,  name: '3. Crispy Fried Chicken' },
    { id: 4, start: 66,  end: 78,  name: '4. Assembling Her Tiffin' },
    { id: 5, start: 78,  end: 106, name: '5. The Handwritten Letter' },
    { id: 6, start: 106, end: 115, name: '6. The Interruption' },
    { id: 7, start: 115, end: 128, name: '7. The Letter Reaches Her' },
  ];

  const LETTER_LINES = [
    'Hi, Gungun.',
    '',
    "When I think of u, idk why my pain disappears, there's just",
    'something about u that only the thought of u makes me sedated.',
    '',
    "It's been so long that we've met, talked about each other's",
    'laughs, about how much we love each other.',
    '',
    "I know u are disappointed from me. I wasn't the perfect bf,",
    "messed up at times, wasn't upto your expectations.",
    '',
    "There's no point of giving excuses as I know the ultimate goal",
    'of my life is supposed to make u happy and comfortable,',
    'not just having the intentions to do so.',
    '',
    "So from the bottom of my heart, I'm SORRY dear BUBU, u deserve",
    "the best in the world, and I'm trying to give you the best,",
    'just not so capable yet...',
    '',
    "Hopefully, you'll understand. Thanks for being in my life",
    'and making it colourful.',
    '',
    'I Lo....'
  ];

  const FULL_LETTER_CHARS = LETTER_LINES.reduce((acc, l) => acc + l.length + 1, 0);

  // =========================================================================
  // DOM & CANVASES
  // =========================================================================
  const pCanvas = document.getElementById('pixel-canvas');
  const ctx = pCanvas.getContext('2d', { alpha: false });
  ctx.imageSmoothingEnabled = false;

  const lCanvas = document.getElementById('letter-canvas');
  const lCtx = lCanvas.getContext('2d');

  const titleOverlay = document.getElementById('title-overlay');
  const playStartBtn = document.getElementById('play-start-btn');
  const playPauseBtn = document.getElementById('play-pause-btn');
  const muteBtn = document.getElementById('mute-btn');
  const scrubber = document.getElementById('scrubber');
  const sceneLabel = document.getElementById('scene-label');
  const timeLabel = document.getElementById('time-label');
  const controls = document.getElementById('controls');
  const endingBar = document.getElementById('ending-bar');
  const replayEndBtn = document.getElementById('replay-end-btn');

  // =========================================================================
  // STATE
  // =========================================================================
  let t = 0;
  let playing = false;
  let started = false;
  let muted = false;
  let lastFrameMs = performance.now();
  let lastBeepStep = -1;
  let doorbellPlayed = false;
  let windPlayed = false;
  let latchPlayed = false;

  // =========================================================================
  // MATH & PIXEL HELPERS
  // =========================================================================
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, u) => a + (b - a) * clamp(u, 0, 1);
  const smoothstep = (a, b, x) => {
    const u = clamp((x - a) / (b - a), 0, 1);
    return u * u * (3 - 2 * u);
  };
  const hash = (n) => {
    const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  };

  function pxRect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  }

  function pxCircle(cx, cy, r, color) {
    ctx.fillStyle = color;
    const x0 = Math.round(cx), y0 = Math.round(cy), rr = Math.round(r);
    for (let dy = -rr; dy <= rr; dy++) {
      for (let dx = -rr; dx <= rr; dx++) {
        if (dx * dx + dy * dy <= rr * rr) {
          ctx.fillRect(x0 + dx, y0 + dy, 1, 1);
        }
      }
    }
  }

  function pxEllipse(cx, cy, rx, ry, color) {
    ctx.fillStyle = color;
    const x0 = Math.round(cx), y0 = Math.round(cy);
    const irx = Math.round(rx), iry = Math.round(ry);
    if (irx <= 0 || iry <= 0) return;
    for (let dy = -iry; dy <= iry; dy++) {
      for (let dx = -irx; dx <= irx; dx++) {
        if ((dx * dx) / (irx * irx) + (dy * dy) / (iry * iry) <= 1) {
          ctx.fillRect(x0 + dx, y0 + dy, 1, 1);
        }
      }
    }
  }

  function pxLine(x0, y0, x1, y1, color) {
    ctx.fillStyle = color;
    let ix0 = Math.round(x0), iy0 = Math.round(y0);
    const ix1 = Math.round(x1), iy1 = Math.round(y1);
    const dx = Math.abs(ix1 - ix0), sx = ix0 < ix1 ? 1 : -1;
    const dy = -Math.abs(iy1 - iy0), sy = iy0 < iy1 ? 1 : -1;
    let err = dx + dy;
    while (true) {
      ctx.fillRect(ix0, iy0, 1, 1);
      if (ix0 === ix1 && iy0 === iy1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; ix0 += sx; }
      if (e2 <= dx) { err += dx; iy0 += sy; }
    }
  }

  function pxText(str, x, y, color, align = 'left') {
    ctx.fillStyle = color;
    ctx.font = 'bold 8px monospace';
    ctx.textAlign = align;
    ctx.fillText(str, Math.round(x), Math.round(y));
  }

  // =========================================================================
  // PROCEDURAL WEB AUDIO ENGINE
  // =========================================================================
  let audioCtx = null;
  let masterGain = null;

  function initAudio() {
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = muted ? 0 : 0.35;
    masterGain.connect(audioCtx.destination);
  }

  function setMute(m) {
    muted = m;
    muteBtn.textContent = muted ? 'Sound: Off' : 'Sound: On';
    if (masterGain && audioCtx) {
      masterGain.gain.setTargetAtTime(muted ? 0 : 0.35, audioCtx.currentTime, 0.05);
    }
  }

  function playNote(freq, dur, type = 'triangle', vol = 0.09, attack = 0.03) {
    if (!audioCtx || muted || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1800;

    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vol, now + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    osc.connect(filter);
    filter.connect(g);
    g.connect(masterGain);
    osc.start(now);
    osc.stop(now + dur + 0.05);
  }

  function playNoiseBurst(dur, freq, q, vol = 0.06) {
    if (!audioCtx || muted || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    const len = Math.floor(audioCtx.sampleRate * dur);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;

    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = freq;
    filter.Q.value = q;

    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    src.connect(filter);
    filter.connect(g);
    g.connect(masterGain);
    src.start(now);
  }

  function playDoorbell() {
    if (!audioCtx || muted || audioCtx.state !== 'running') return;
    playNote(659.25, 0.7, 'sine', 0.22, 0.01); // E5
    setTimeout(() => playNote(523.25, 1.1, 'sine', 0.22, 0.01), 240); // C5
  }

  const CHORDS = [
    [174.61, 220.00, 261.63, 329.63], // Fmaj7
    [164.81, 196.00, 246.94, 293.66], // Em7
    [146.83, 174.61, 220.00, 261.63], // Dm7
    [130.81, 164.81, 196.00, 246.94], // Cmaj7
  ];
  const MELODY = [523.25, 587.33, 659.25, 523.25, 440.00, 493.88, 523.25, 392.00];

  function updateAudioForTime(nowT) {
    if (!audioCtx || !playing || audioCtx.state !== 'running') return;

    // Gentle beat every 0.5s
    const step = Math.floor(nowT * 2);
    if (step !== lastBeepStep) {
      lastBeepStep = step;
      const inInterruption = nowT >= 106.0 && nowT < 109.0;
      if (!inInterruption) {
        if (step % 4 === 0) {
          const chord = CHORDS[Math.floor(step / 4) % CHORDS.length];
          const vol = nowT >= 78 ? 0.055 : 0.07;
          chord.forEach((f, idx) => {
            setTimeout(() => playNote(f, 1.8, 'sine', vol, 0.05), idx * 45);
          });
        }
        if (step % 2 === 1 && nowT < 122) {
          const m = MELODY[step % MELODY.length];
          playNote(m, 0.55, 'triangle', nowT >= 78 ? 0.04 : 0.055, 0.02);
        }
      }

      // Contextual Foley SFX
      if (nowT >= 9.5 && nowT <= 13.0) {
        playNoiseBurst(0.06, 1400, 2.5, 0.05); // chopping herbs
      }
      if (nowT >= 20.0 && nowT <= 23.5) {
        playNoiseBurst(0.25, 2400, 0.9, 0.025); // steam hiss
      }
      if (nowT >= 26.0 && nowT <= 28.0) {
        playNoiseBurst(0.05, 1900, 3.0, 0.04); // slicing fish
      }
      if (nowT >= 54.0 && nowT <= 59.5) {
        playNoiseBurst(0.35, 3200, 0.7, 0.055); // hot oil sizzle
      }
      if (nowT >= 80.5 && nowT <= 105.5) {
        playNoiseBurst(0.03, 2800, 4.0, 0.018); // soft pen scratch
      }
    }

    if (nowT >= 72.2 && nowT < 72.6 && !latchPlayed) {
      latchPlayed = true;
      playNoiseBurst(0.05, 900, 3.0, 0.08);
    }
    if (nowT >= 106.0 && nowT < 106.5 && !doorbellPlayed) {
      doorbellPlayed = true;
      playDoorbell();
    }
    if (nowT >= 108.8 && nowT < 109.5 && !windPlayed) {
      windPlayed = true;
      playNoiseBurst(1.6, 520, 1.2, 0.07);
    }
  }

  // =========================================================================
  // SHARED PIXEL-ART CHARACTER & KITCHEN ENVIRONMENT
  // =========================================================================
  function drawKitchenBackground(panX = 0, warmBoost = 0) {
    // Wall & tiles
    pxRect(0, 0, W, 118, '#3b2d38');
    // Subtle tiled backsplash
    for (let y = 52; y < 116; y += 10) {
      for (let x = -((panX | 0) % 16); x < W; x += 16) {
        pxRect(x, y, 15, 9, '#493845');
        pxRect(x, y, 15, 1, '#584452');
      }
    }

    // Window in background (left-ish)
    const wx = 22 - panX * 0.4;
    if (wx > -70 && wx < W + 20) {
      pxRect(wx, 14, 58, 52, '#241a24');
      pxRect(wx + 3, 17, 52, 46, '#f6c28b'); // warm sky
      pxRect(wx + 3, 17, 52, 22, '#f9d7a7');
      // Window bars
      pxRect(wx + 28, 17, 2, 46, '#3a2832');
      pxRect(wx + 3, 39, 52, 2, '#3a2832');
      // Sunbeam
      ctx.fillStyle = `rgba(255, 225, 170, ${0.08 + warmBoost})`;
      ctx.beginPath();
      ctx.moveTo(wx + 3, 63);
      ctx.lineTo(wx + 55, 63);
      ctx.lineTo(wx + 90, 145);
      ctx.lineTo(wx + 12, 145);
      ctx.closePath();
      ctx.fill();
    }

    // Hanging shelf & jars
    const sx = 120 - panX * 0.6;
    pxRect(sx, 26, 96, 4, '#6e473b');
    pxRect(sx + 8, 12, 12, 14, '#d9cfc1'); // jar
    pxRect(sx + 9, 10, 10, 2, '#9b6b43');
    pxRect(sx + 26, 15, 10, 11, '#82a67d'); // herb pot
    pxRect(sx + 28, 8, 6, 7, '#5c8a56');
    pxRect(sx + 50, 11, 14, 15, '#c97a63'); // spice jar
    pxRect(sx + 72, 14, 12, 12, '#e6b87d'); // oil bottle

    // Countertop
    pxRect(0, 116, W, 6, '#e7d5be');
    pxRect(0, 122, W, 58, '#c99c72');
    pxRect(0, 122, W, 2, '#b0825a');
    // Wood grain lines
    for (let i = 0; i < 6; i++) {
      pxRect((i * 58 - (panX | 0)) % W, 134 + (i % 3) * 14, 24, 1, '#b6875d');
    }
  }

  function drawChef(cx, cy, armLAngle, armRAngle, headTilt = 0, lookDir = 0) {
    // Torso (apron over cozy sweater)
    pxRect(cx - 14, cy + 16, 28, 30, '#4f6d7a'); // sweater
    pxRect(cx - 10, cy + 18, 20, 28, '#f4e8d8'); // apron
    pxRect(cx - 10, cy + 16, 2, 6, '#d9cbb8');  // apron strap
    pxRect(cx + 8, cy + 16, 2, 6, '#d9cbb8');
    // Little heart stitched on apron
    pxRect(cx - 2, cy + 25, 2, 2, '#e06b6b');
    pxRect(cx + 1, cy + 25, 2, 2, '#e06b6b');
    pxRect(cx - 1, cy + 27, 3, 2, '#e06b6b');

    // Head
    const hx = cx + headTilt;
    const hy = cy;
    pxRect(hx - 9, hy - 2, 18, 18, '#f0bfa0'); // face
    pxRect(hx - 10, hy - 5, 20, 7, '#271e29'); // hair top
    pxRect(hx - 10, hy - 2, 3, 9, '#271e29'); // hair left
    pxRect(hx + 7, hy - 2, 3, 9, '#271e29');  // hair right
    // Eyes
    const ex = lookDir * 2;
    pxRect(hx - 5 + ex, hy + 5, 2, 3, '#1d1620');
    pxRect(hx + 3 + ex, hy + 5, 2, 3, '#1d1620');
    // Warm blush
    pxRect(hx - 7 + ex, hy + 9, 3, 2, '#e89082');
    pxRect(hx + 4 + ex, hy + 9, 3, 2, '#e89082');
    // Smile
    pxRect(hx - 2 + ex, hy + 11, 4, 1, '#9c564a');

    // Arms & hands reaching forward onto counter
    const lx = cx - 15 + Math.sin(armLAngle) * 5;
    const ly = cy + 32 + Math.cos(armLAngle) * 3;
    pxLine(cx - 12, cy + 20, lx, ly, '#4f6d7a');
    pxLine(cx - 11, cy + 20, lx + 1, ly, '#4f6d7a');
    pxCircle(lx, ly, 3, '#f0bfa0');

    const rx = cx + 15 + Math.sin(armRAngle) * 5;
    const ry = cy + 32 + Math.cos(armRAngle) * 3;
    pxLine(cx + 12, cy + 20, rx, ry, '#4f6d7a');
    pxLine(cx + 11, cy + 20, rx - 1, ry, '#4f6d7a');
    pxCircle(rx, ry, 3, '#f0bfa0');
  }

  function drawSteam(x, y, count, time, spread = 12) {
    for (let i = 0; i < count; i++) {
      const phase = (time * 0.7 + i * 0.27) % 1;
      const sx = x + Math.sin(time * 2 + i * 1.9) * (spread * 0.4) + (i - count / 2) * 3;
      const sy = y - phase * 28;
      const alpha = (1 - phase) * 0.55;
      ctx.fillStyle = `rgba(255, 250, 245, ${alpha})`;
      const size = phase < 0.5 ? 3 : 2;
      ctx.fillRect(Math.round(sx), Math.round(sy), size, size);
    }
  }

  // =========================================================================
  // SCENE 1: PREPARING THE DUMPLINGS (0s - 24s)
  // =========================================================================
  function renderScene1(lt) {
    drawKitchenBackground(0, 0.04);

    // Chef standing behind counter
    const bob = Math.sin(lt * 4) * 1.5;
    const armSpeed = lt > 6 && lt < 17 ? lt * 8 : lt * 3;
    drawChef(160, 74 + Math.abs(bob) * 0.4, armSpeed, -armSpeed + 1.2, Math.sin(lt * 1.5) * 1);

    // Cutting board / prep mat
    pxRect(92, 128, 136, 36, '#deb887');
    pxRect(92, 162, 136, 3, '#b88d5c');

    // Flour jar & water pitcher on left
    pxRect(26, 122, 22, 26, '#efe9df');
    pxRect(28, 118, 18, 4, '#a87449');
    pxText('FLOUR', 37, 138, '#9b8b7a', 'center');

  // =========================================================================
  // CRISP READABLE HANDWRITTEN LETTER OVERLAY (SCENES 5, 6, 7)
  // =========================================================================
  function renderLetterOverlay(globalT) {
    lCtx.clearRect(0, 0, lCanvas.width, lCanvas.height);
    if (globalT < 78.0) return;

    const cw = lCanvas.width;
    const ch = lCanvas.height;

    // Determine how many characters are written so far
    // Scene 5: 80.0s -> 106.0s writes all characters cleanly
    let charsToShow = FULL_LETTER_CHARS;
    if (globalT < 80.0) {
      charsToShow = 0;
    } else if (globalT < 106.0) {
      const u = (globalT - 80.0) / 26.0;
      charsToShow = Math.floor(u * FULL_LETTER_CHARS);
    }

    // Compute paper transform:
    // Scene 5 (78-106s): flat/angled on desk, comfortable close-up
    // Scene 6 (106-115s): lifts off desk, flutters & drifts out window, then toward camera
    // Scene 7 (115-128s): approaches lens and lands gently filling almost entire frame!
    let px = cw * 0.50;
    let py = ch * 0.54;
    let scale = 0.86;
    let rot = -0.02;
    let alpha = 1;

    if (globalT < 80.0) {
      alpha = smoothstep(78.0, 79.5, globalT);
      py = lerp(ch * 0.68, ch * 0.54, alpha);
    } else if (globalT >= 108.5 && globalT < 115.0) {
      const u = (globalT - 108.5) / 6.5;
      // Flutter away toward window then curve back toward camera
      const arc = Math.sin(u * Math.PI);
      px = lerp(cw * 0.50, cw * 0.72, arc) + Math.sin(u * 11) * 28;
      py = lerp(ch * 0.54, ch * 0.34, arc) + Math.cos(u * 9) * 18;
      scale = lerp(0.86, 0.24, Math.sin(u * Math.PI * 0.85));
      rot = Math.sin(u * 8) * 0.38;
    } else if (globalT >= 115.0 && globalT < 119.2) {
      const u = smoothstep(115.0, 119.2, globalT);
      px = lerp(cw * 0.62, cw * 0.50, u) + Math.sin(u * 6) * (1 - u) * 30;
      py = lerp(ch * 0.42, ch * 0.50, u) + Math.cos(u * 5) * (1 - u) * 20;
      scale = lerp(0.28, 1.04, u);
      rot = lerp(0.22, 0.0, u);
    } else if (globalT >= 119.2) {
      // Resting gently against the camera
      px = cw * 0.50;
      py = ch * 0.50;
      scale = 1.04;
      rot = 0;
    }

    lCtx.save();
    lCtx.globalAlpha = alpha;
    lCtx.translate(px, py);
    lCtx.rotate(rot);
    lCtx.scale(scale, scale);

    const paperW = 760;
    const paperH = 610;
    const left = -paperW / 2;
    const top = -paperH / 2;

    // Paper drop shadow
    lCtx.fillStyle = 'rgba(10, 6, 14, 0.45)';
    lCtx.fillRect(left + 12, top + 14, paperW, paperH);

    // Warm cream letter paper
    lCtx.fillStyle = '#fbf3e4';
    lCtx.fillRect(left, top, paperW, paperH);
    lCtx.strokeStyle = '#dfd0b8';
    lCtx.lineWidth = 3;
    lCtx.strokeRect(left, top, paperW, paperH);

    // Faint ruled lines for authentic notebook/letter feel
    lCtx.strokeStyle = 'rgba(180, 198, 218, 0.38)';
    lCtx.lineWidth = 1;
    for (let ly = top + 46; ly < top + paperH - 22; ly += 23) {
      lCtx.beginPath();
      lCtx.moveTo(left + 28, ly);
      lCtx.lineTo(left + paperW - 28, ly);
      lCtx.stroke();
    }

    // Crisp, readable handwritten-style ink text
    lCtx.fillStyle = '#242942';
    lCtx.font = 'italic 18px "Segoe Script", "Brush Script MT", "Comic Sans MS", Georgia, serif';
    lCtx.textBaseline = 'bottom';

    let remaining = charsToShow;
    let penX = left + 42;
    let penY = top + 45;
    let penActive = false;

    for (let i = 0; i < LETTER_LINES.length; i++) {
      const line = LETTER_LINES[i];
      const y = top + 45 + i * 23;
      if (remaining <= 0) break;

      const slice = line.slice(0, remaining);
      lCtx.fillText(slice, left + 42, y);

      if (remaining <= line.length && globalT >= 80.0 && globalT < 106.0) {
        penX = left + 42 + lCtx.measureText(slice).width;
        penY = y - 2;
        penActive = true;
      }
      remaining -= (line.length + 1);
    }

    // Draw animated pen & hand while writing (Scene 5)
    if (penActive) {
      // Pen nib & barrel
      lCtx.save();
      lCtx.translate(penX, penY);
      lCtx.rotate(-0.45);
      // Nib
      lCtx.fillStyle = '#d4af37';
      lCtx.beginPath();
      lCtx.moveTo(0, 0);
      lCtx.lineTo(6, -14);
      lCtx.lineTo(-4, -14);
      lCtx.closePath();
      lCtx.fill();
      // Pen body
      lCtx.fillStyle = '#2c2233';
      lCtx.fillRect(-5, -96, 12, 82);
      // Hand fingers gripping pen
      lCtx.fillStyle = '#f0bfa0';
      lCtx.beginPath();
      lCtx.ellipse(14, -36, 26, 18, 0.2, 0, Math.PI * 2);
      lCtx.fill();
      lCtx.restore();
    } else if (globalT >= 106.0 && globalT < 107.6) {
      // Doorbell interruption: pen lifts slightly off the last word!
      const lift = smoothstep(106.0, 107.0, globalT) * 35;
      lCtx.save();
      lCtx.translate(left + 106 + lift, top + 45 + 22 * 23 - lift);
      lCtx.rotate(-0.65);
      lCtx.fillStyle = '#2c2233';
      lCtx.fillRect(-5, -90, 12, 82);
      lCtx.restore();
    }

    lCtx.restore();
  }

  // =========================================================================
  // MAIN RENDER LOOP
  // =========================================================================
  function getScene(nowT) {
    for (const s of SCENES) {
      if (nowT >= s.start && nowT < s.end) return s;
    }
    return SCENES[SCENES.length - 1];
  }

  function formatTime(sec) {
    const s = Math.floor(sec);
    const m = Math.floor(s / 60);
    const r = s % 60;
    return `${m}:${r < 10 ? '0' : ''}${r}`;
  }

  function renderFrame(nowT) {
    const s = getScene(nowT);
    const lt = nowT - s.start;

    if (s.id === 1) renderScene1(lt);
    else if (s.id === 2) renderScene2(lt);
    else if (s.id === 3) renderScene3(lt);
    else if (s.id === 4) renderScene4(lt);
    else drawStudyRoom(lt, nowT);

    // Smooth cross-fade transitions between scenes 1..5
    for (const sc of SCENES) {
      if (sc.id > 1 && sc.id <= 5 && Math.abs(nowT - sc.start) < 0.45) {
        const fade = 1 - Math.abs(nowT - sc.start) / 0.45;
        ctx.fillStyle = `rgba(14, 10, 18, ${fade * 0.7})`;
        ctx.fillRect(0, 0, W, H);
      }
    }

    renderLetterOverlay(nowT);

    // Update UI
    sceneLabel.textContent = s.name;
    scrubber.value = nowT;
    timeLabel.textContent = `${formatTime(nowT)} / ${formatTime(TOTAL_DURATION)}`;

    if (nowT >= 122.0) {
      endingBar.classList.add('show');
    } else {
      endingBar.classList.remove('show');
    }
  }

  function loop(nowMs) {
    const dt = Math.min(0.1, (nowMs - lastFrameMs) / 1000);
    lastFrameMs = nowMs;

    if (playing) {
      t += dt;
      if (t >= TOTAL_DURATION) {
        t = TOTAL_DURATION;
        playing = false;
        playPauseBtn.textContent = 'Replay';
      }
      updateAudioForTime(t);
    }

    renderFrame(t);
    requestAnimationFrame(loop);
  }

  // =========================================================================
  // CONTROLS & EVENTS
  // =========================================================================
  function startFilm() {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    started = true;
    playing = true;
    titleOverlay.classList.add('hidden');
    playPauseBtn.textContent = 'Pause';
    controls.classList.add('visible');
    setTimeout(() => controls.classList.remove('visible'), 2500);
  }

  function resetFlagsForSeek(newT) {
    if (newT < 72.2) latchPlayed = false;
    if (newT < 106.0) doorbellPlayed = false;
    if (newT < 108.8) windPlayed = false;
  }

  playStartBtn.addEventListener('click', startFilm);

  playPauseBtn.addEventListener('click', () => {
    if (!started) { startFilm(); return; }
    if (t >= TOTAL_DURATION) {
      t = 0;
      resetFlagsForSeek(0);
      playing = true;
      playPauseBtn.textContent = 'Pause';
      return;
    }
    playing = !playing;
    playPauseBtn.textContent = playing ? 'Pause' : 'Play';
  });

  replayEndBtn.addEventListener('click', () => {
    t = 0;
    resetFlagsForSeek(0);
    playing = true;
    playPauseBtn.textContent = 'Pause';
  });

  muteBtn.addEventListener('click', () => setMute(!muted));

  scrubber.addEventListener('input', (e) => {
    t = parseFloat(e.target.value);
    resetFlagsForSeek(t);
    renderFrame(t);
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      playPauseBtn.click();
    }
  });

  // Render initial preview frame behind title overlay
  renderFrame(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
